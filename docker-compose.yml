# Практична робота 7 — обробка та аналіз IoT-даних в openHAB (RRD4j).
# Basic UI: http://localhost:8083/basicui/app?sitemap=climate
services:
  openhab:
    image: openhab/openhab:4.2.2
    container_name: iotpr7-openhab
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      USER_ID: "9001"
      GROUP_ID: "9001"
      CRYPTO_POLICY: "unlimited"
      EXTRA_JAVA_OPTS: "-Duser.timezone=Europe/Kyiv"
    volumes:
      - ./openhab/conf:/openhab/conf
      - openhab_userdata:/openhab/userdata   # тут лежить база RRD4j: userdata/persistence/rrd4j/*.rrd
      - openhab_addons:/openhab/addons

volumes:
  openhab_userdata:
  openhab_addons:
